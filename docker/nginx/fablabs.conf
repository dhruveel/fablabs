# Reference copy — the live file lives on the VPS at
# /etc/nginx/conf.d/fablabs.conf. Not used by Docker; kept in the repo so
# the reverse-proxy config isn't only living on the server.
server {
    listen 80;
    listen [::]:80;
    server_name fablabs.in www.fablabs.in;

    # Quote-request images can come straight from a phone camera.
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
